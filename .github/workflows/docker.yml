# Docker-Image bauen und in die GitHub Container Registry legen (ghcr.io/miro4you/fem).
# Der Server bzw. das NAS holt nur noch das fertige Image ab – kein Kompilieren dort.
#   :latest       – Stand von main
#   :entwicklung  – neuester Stand eines Entwicklungszweigs (zum Testen)
#   :sha-xxxxxxx  – genau dieser Commit
name: Docker-Image

on:
  push:
    branches: [main, "claude/**"]
    paths-ignore: ["**.md", "**.pdf", "docs/**", "cad-addins/**", "examples/**"]
  workflow_dispatch:

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/miro4you/fem
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=raw,value=entwicklung,enable=${{ github.ref != 'refs/heads/main' }}
            type=sha,format=short

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Zwischenstände (Rust-Abhängigkeiten, npm) zwischenspeichern: spätere Builds deutlich schneller
          cache-from: type=gha
          cache-to: type=gha,mode=max
