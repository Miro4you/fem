[package]
name = "projekt-fem-app"
version.workspace = true
edition.workspace = true
description = "Projekt-FEM Desktop-App"

[lib]
name = "projekt_fem_app"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
fem-core = { path = "../../crates/fem-core" }
# Heimnetz-Freigabe (Webserver)
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "net", "signal", "macros", "fs", "time"] }
tower-http = { version = "0.6", features = ["compression-gzip"] }
rust-embed = "8"
mime_guess = "2"
getrandom = "0.3"
base64 = "0.22"
ureq = { version = "2", features = ["json"] }
