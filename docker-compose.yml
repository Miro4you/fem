# Projekt-FEM auf einem Server (wie MathPad).
# Fertiges Image von GitHub holen (empfohlen):   docker compose pull && docker compose up -d
# Selbst bauen (dauert 10–20 min):               docker compose up -d --build
services:
  projekt-fem:
    image: ghcr.io/miro4you/fem:${PROJEKT_FEM_TAG:-entwicklung}
    build: .
    container_name: projekt-fem
    restart: unless-stopped
    ports:
      - "8790:8790"
    environment:
      # fester Zugangsschlüssel (mindestens 12 Buchstaben/Ziffern), steht in der Adresse …/#k=SCHLÜSSEL
      - PROJEKT_FEM_SCHLUESSEL=${PROJEKT_FEM_SCHLUESSEL:-}
      # 1 = ganz ohne Zugangsschlüssel (nur im Heimnetz, z. B. NAS – nie mit Portfreigabe ins Internet!)
      - PROJEKT_FEM_OHNE_SCHLUESSEL=${PROJEKT_FEM_OHNE_SCHLUESSEL:-0}
    volumes:
      - fem-daten:/daten
    # Rechnen braucht Arbeitsspeicher: ~2,5 GB je Million Unbekannte
    mem_limit: ${PROJEKT_FEM_SPEICHER:-6g}

volumes:
  fem-daten:
