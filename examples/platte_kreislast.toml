# Platte 100 × 60 × 5 mm, links eingespannt.
# Last 1: 500 N nur auf einem Kreis Ø20 auf der Oberseite (z. B. Auflagefläche eines Aufbauteils)
# Last 2: Torsionsmoment 5 N·m nur auf einem Rechteck 20 × 10 an der rechten Stirnseite
# Einheiten: mm, N, MPa (Momente in N·mm)

[mesh]
type = "box"
size = [100.0, 60.0, 5.0]
cells = [40, 24, 2]
order = 2

[material]
name = "S235"
E = 210000.0
nu = 0.3
yield = 235.0

[[group]]
name = "einspannung"
plane = { axis = "x", value = 0.0 }

[[group]]
name = "oben_kreis"
plane = { axis = "z", value = 5.0 }
region = { shape = "circle", center = [70.0, 30.0, 5.0], normal = [0.0, 0.0, 1.0], radius = 10.0 }

[[group]]
name = "stirn_rechteck"
plane = { axis = "x", value = 100.0 }
region = { shape = "rect", center = [100.0, 30.0, 2.5], normal = [1.0, 0.0, 0.0], u = [0.0, 1.0, 0.0], width = 20.0, height = 10.0 }

[[support]]
group = "einspannung"

[[load]]
group = "oben_kreis"
force = [0.0, 0.0, -500.0]

[[load]]
group = "stirn_rechteck"
moment = [5000.0, 0.0, 0.0]
