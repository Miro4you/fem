# Quadratische Platte 200 × 200 × 5 mm aus Aluminium (EN AW-6082 T6), an allen
# vier Rändern gelenkig gelagert, Flächendruck 0,02 MPa (= 0,2 bar) von oben.
#
# Wegen der Symmetrie wird nur ein Viertel (100 × 100 mm) gerechnet:
#   Ränder x = 0 und y = 0  → gelenkig gelagert (z fest)
#   Schnitte x = 100, y = 100 → Symmetrie (x bzw. y fest)
# Die Plattenmitte liegt damit bei (100, 100).
#
# Plattentheorie (Navier):  w_mitte = 0,00406·p·a⁴/D ≈ 0,16 mm,  σ_mitte ≈ 0,287·p·a²/t² ≈ 9,2 MPa

[mesh]
type = "box"
size = [100.0, 100.0, 5.0]
cells = [20, 20, 2]

[material]
name = "EN AW-6082 T6"
E = 70000.0
nu = 0.3
yield = 250.0

[[group]]
name = "rand_x"
plane = { axis = "x", value = 0.0 }

[[group]]
name = "rand_y"
plane = { axis = "y", value = 0.0 }

[[group]]
name = "symmetrie_x"
plane = { axis = "x", value = 100.0 }

[[group]]
name = "symmetrie_y"
plane = { axis = "y", value = 100.0 }

[[group]]
name = "oben"
plane = { axis = "z", value = 5.0 }

[[support]]
group = "rand_x"
fix = ["z"]

[[support]]
group = "rand_y"
fix = ["z"]

[[support]]
group = "symmetrie_x"
fix = ["x"]

[[support]]
group = "symmetrie_y"
fix = ["y"]

[[load]]
group = "oben"
pressure = 0.02
